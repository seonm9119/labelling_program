services:
  labeling-program:
    build: .
    image: labeling-program:latest
    container_name: labeling-program
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      # 코드 변경 시 바로 반영
      - ./app.py:/app/app.py:ro
      - ./config.py:/app/config.py:ro
      - ./routes:/app/routes:ro
      - ./services:/app/services:ro
      - ./utils:/app/utils:ro
      - /home/nami/repo/private.txt:/run/secrets/private.txt:ro
      # Host filesystem mounts
      - /home:/home
      - /mnt/h:/mnt/h:rw,rslave
    environment:
      - APP_DEBUG=1
      - APP_PORT=5001
      - DEFAULT_DATA_PATH=/
      - PADDLE_OCR_API_URL=http://paddle-ocr:8001/inference
      - PADDLE_OCR_RELEASE_URL=http://paddle-ocr:8001/release
      - DEEPSEEK_OCR_API_URL=http://deepseek-ocr:8002/inference
      - DEEPSEEK_OCR_RELEASE_URL=http://deepseek-ocr:8002/release
      - DEEPSEEK_OCR_API_TIMEOUT=600
      - DEEPSEEK_OCR_BASE_SIZE=1024
      - DEEPSEEK_OCR_IMAGE_SIZE=768
      - DEEPSEEK_OCR_CROP_MODE=true
      - DEEPSEEK_OCR_MAX_NEW_TOKENS=8192
      - DEEPSEEK_OCR_USE_CACHE=true
      - DOCLAYOUT_API_URL=http://doclayout:8003/inference
      - DOCLAYOUT_RELEASE_URL=http://doclayout:8003/release
      - DOCLAYOUT_API_TIMEOUT=180
      - DOCLAYOUT_IMAGE_SIZE=1024
      - DOCLAYOUT_CONFIDENCE=0.2
      - DOCLAYOUT_IOU=0.45
      - DOCLAYOUT_MAX_DET=300
      - VLM_KEYVALUE_API_URL=${VLM_KEYVALUE_API_URL:-}
      - VLM_KEYVALUE_API_TIMEOUT=180
      - OLLAMA_KEYVALUE_API_URL=${OLLAMA_KEYVALUE_API_URL:-http://ollama:11434/api/generate}
      - OLLAMA_KEYVALUE_MODEL=${OLLAMA_KEYVALUE_MODEL:-qwen2.5vl:3b}
      - GPT_KEYVALUE_API_URL=${GPT_KEYVALUE_API_URL:-}
      - GPT_KEYVALUE_API_TIMEOUT=180
      - GPT_KEYVALUE_OPENAI_API_URL=${GPT_KEYVALUE_OPENAI_API_URL:-https://api.openai.com/v1/responses}
      - GPT_KEYVALUE_OPENAI_MODEL=${GPT_KEYVALUE_OPENAI_MODEL:-gpt-5-mini}
      - OPENAI_API_KEY_FILE=${OPENAI_API_KEY_FILE:-/run/secrets/private.txt}
      - OPENAI_API_KEY_SECTION=${OPENAI_API_KEY_SECTION:-gpt.txt}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - model-network
    restart: unless-stopped

networks:
  model-network:
    external: true
